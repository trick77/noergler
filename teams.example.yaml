# teams.yaml — one entry per team served by this noergler instance.
#
# Point TEAMS_CONFIG at this file (default: ./teams.yaml). noergler does not
# start without it, and a team block that fails validation disables that team
# only; the instance still boots for the others (see the startup log:
# `team_disabled team=<slug> reason=...` and `teams_ready enabled=[...]`).
#
# Secrets are NEVER in this file. Every `*_env` field names an environment
# variable holding the value (kept in the k8s Secret / .env). Convention, not
# enforced: TEAM_<SLUG>_... with the slug uppercased and `-` replaced by `_`.
#
# Convention in this example:
#   - a live line ending in `# required` is mandatory
#   - a commented line is optional; the comment names its default, and
#     "instance ..." means the value is inherited from that env var
#
# Team-overridable: model, reasoning effort, context window, every REVIEW_*
# knob except the two prompt templates, the Jira acceptance-criteria prefixes,
# riptide. NOT overridable (instance-wide, naming them here disables the
# team): OPENAI_BASE_URL, MODEL_CATALOG_URL, REVIEW_PROMPT_TEMPLATE,
# REVIEW_MENTION_PROMPT_TEMPLATE.

teams:
  # --- A team using every optional block ------------------------------------
  - slug: platform                                    # required; [a-z0-9-], unique. Webhook path /webhook/platform, pr_reviews.team_slug, log field team=platform
    name: "Platform Engineering"                      # optional, default: the slug. Display only.
    webhook_secret_env: TEAM_PLATFORM_WEBHOOK_SECRET  # required; env var holding this team's Bitbucket webhook HMAC secret (openssl rand -hex 32)
    projects:                                         # required, at least one. Bitbucket project keys this team owns; a project or repo may belong to ONE team only
      - key: PLAT                                     # whole project: every current and future repo under PLAT (one project webhook, nothing to do for a new repo). Prefer this
      - key: INFRA
        repos: [terraform-core, ansible]              # only these repos (one repo webhook each); for a project shared between teams. A new repo needs an entry here
    inference:
      api_key_env: TEAM_PLATFORM_OPENAI_API_KEY       # required; env var holding this team's key for the OpenAI-compatible endpoint (spend is attributed per key)
      # model: gpt-5.4                                # optional, default: instance OPENAI_MODEL. Must be spelled as the catalog spells it
      # reasoning_effort: high                        # optional, default: instance OPENAI_REASONING_EFFORT. One of minimal, low, medium, high
      # context_window: 0                             # optional, default: instance OPENAI_CONTEXT_WINDOW. 0 = from the catalog
    review:                                           # optional block; any ReviewConfig field, same names as REVIEW_* without the prefix, lowercase
      auto_review_authors: [alice, bob]               # optional, default: instance REVIEW_AUTO_REVIEW_AUTHORS (empty = all authors)
      max_pr_cost_usd: 8.00                           # optional, default: instance REVIEW_MAX_PR_COST_USD
      agents_md_custom_link: "[Platform AGENTS.md guide](https://wiki.example.com/platform/agents-md)"  # optional, default: instance REVIEW_AGENTS_MD_CUSTOM_LINK
      # max_comments: 25                              # optional, default: instance REVIEW_MAX_COMMENTS
      # max_file_lines: 1000                          # optional, default: instance REVIEW_MAX_FILE_LINES
      # diff_extra_lines_before: 3                    # optional, default: instance REVIEW_DIFF_EXTRA_LINES_BEFORE
      # diff_extra_lines_after: 2                     # optional, default: instance REVIEW_DIFF_EXTRA_LINES_AFTER
      # diff_max_extra_lines_dynamic_context: 10      # optional, default: instance REVIEW_DIFF_MAX_EXTRA_LINES_DYNAMIC_CONTEXT
      # diff_allow_dynamic_context: true              # optional, default: instance REVIEW_DIFF_ALLOW_DYNAMIC_CONTEXT
      # ticket_compliance_check: true                 # optional, default: instance REVIEW_TICKET_COMPLIANCE_CHECK
      # require_agents_md: true                       # optional, default: instance REVIEW_REQUIRE_AGENTS_MD
      # agents_md_warn_tokens: 4000                   # optional, default: instance REVIEW_AGENTS_MD_WARN_TOKENS
      # agents_md_max_tokens: 7000                    # optional, default: instance REVIEW_AGENTS_MD_MAX_TOKENS
      # opt_out_branch_keyword: noergloff             # optional, default: instance REVIEW_OPT_OUT_BRANCH_KEYWORD
    jira:                                             # optional block; the Jira URL and user are instance-wide
      acceptance_criteria_prefixes: [AC, AK, DoD]     # optional, default: instance JIRA_ACCEPTANCE_CRITERIA_PREFIXES
    riptide:                                          # optional block; present = forwarding on. Both fields required when present
      url: https://riptide-platform.example.com       # required within the block; this team's riptide-collector
      token_env: TEAM_PLATFORM_RIPTIDE_TOKEN          # required within the block; env var holding the team's riptide bearer

  # --- The minimal team: only the required keys ------------------------------
  # Everything else comes from the instance defaults; riptide is off.
  - slug: payments                                    # required
    webhook_secret_env: TEAM_PAYMENTS_WEBHOOK_SECRET  # required
    projects:                                         # required
      - key: PAY
    inference:
      api_key_env: TEAM_PAYMENTS_OPENAI_API_KEY       # required
