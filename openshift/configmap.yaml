apiVersion: v1
kind: ConfigMap
metadata:
  name: noergler
data:
  BITBUCKET_URL: "https://bitbucket.company.com"
  BITBUCKET_USERNAME: "noergler"
  OPENAI_BASE_URL: "https://litellm.company.com/v1"
  MODEL_CATALOG_URL: "https://ai-gateway-catalog.company.com/model_prices_and_context_window.json"
  REVIEW_AUTO_REVIEW_AUTHORS: ""
  JIRA_URL: "https://jira.company.com"
  TEAMS_CONFIG: "/etc/noergler/teams.yaml"
---
# One block per team; secrets stay in the `noergler` Secret and are referenced
# by name (*_env). See teams.example.yaml for every field.
apiVersion: v1
kind: ConfigMap
metadata:
  name: noergler-teams
data:
  teams.yaml: |
    teams:
      - slug: platform
        webhook_secret_env: TEAM_PLATFORM_WEBHOOK_SECRET
        projects:
          - key: PLAT
        inference:
          api_key_env: TEAM_PLATFORM_OPENAI_API_KEY
