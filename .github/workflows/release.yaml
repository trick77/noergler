name: Release

# By hand only. The only way to release: the image is built on GitHub-hosted runners, never from a laptop. Patch
# tag, image, GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    uses: trick77/ship/.github/workflows/release.yaml@master
    with:
      bump: ${{ inputs.bump }}
      go-dir: backend
    permissions:
      contents: write
      packages: write
