name: CI

# Tests run on pull requests. Master does not run tests: it builds and pushes
# the image (see release.yaml).
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: noergler
          POSTGRES_PASSWORD: noergler
          POSTGRES_DB: noergler_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noergler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # fetch-depth: 0 - hack/patch-coverage.sh diffs the branch against the PR
      # base, which needs real history. The default shallow checkout leaves the
      # base ref unresolvable and the gate exits 2.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # go-version-file rather than a pinned version, so the toolchain cannot
      # drift from what the module itself declares.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # hack/patch-coverage.sh drives diff-cover; without it the patch gate
      # fails with "command not found" after the tests have already run.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install diff-cover==10.3.0
        working-directory: .
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd. Run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: mkdir -p coverage
      # The race detector needs cgo; this is independent of the image's
      # CGO_ENABLED=0 build.
      #
      # -coverpkg=./... attributes coverage across package boundaries: code
      # exercised only by another package's tests (the api tests drive review,
      # store and render) is otherwise reported as uncovered.
      - run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage/backend.out ./...
        env:
          CGO_ENABLED: "1"
          NOERGLER_TEST_DSN: postgres://noergler:noergler@localhost:5432/noergler_test?sslmode=disable
      # Go exposes no line metric - `go tool cover` reports statements only - so
      # the line percentage comes from a Cobertura conversion of the profile.
      # That also merges the duplicate blocks -coverpkg emits, one set per test
      # binary, which a naive sum over the raw profile gets badly wrong.
      - run: go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage/backend.out > coverage/backend.xml
      # The floor gate runs first: when a PR drops the project below the floor
      # the absolute number is the more actionable failure, and reporting it
      # before patch coverage keeps the log readable.
      - run: ./hack/coverage-gate.sh backend
      - name: Backend patch coverage
        run: ./hack/patch-coverage.sh "origin/${{ github.base_ref || 'master' }}"
      # The gate scripts are load-bearing; this is their own test.
      - run: ./hack/coverage-gate.test.sh
