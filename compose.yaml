services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: noergler
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: noergler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noergler"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Same as the init container in the deployment: migrations run before the
  # service, never inside it.
  migrate:
    build:
      context: .
      dockerfile: backend/Containerfile
    command: ["migrate"]
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://noergler:changeme@postgres:5432/noergler}
    depends_on:
      postgres:
        condition: service_healthy

  noergler:
    build:
      context: .
      dockerfile: backend/Containerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://noergler:changeme@postgres:5432/noergler}
      - TEAMS_CONFIG=/app/teams.yaml
    volumes:
      - ./prompts:/app/prompts:ro
      # One entry per team; secrets stay in .env (see teams.example.yaml).
      - ./teams.yaml:/app/teams.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
